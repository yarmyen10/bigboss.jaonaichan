<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="darkTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0E7490" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#15803D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Receipt body -->
  <g filter="url(#shadow)">
    <rect x="14" y="6" width="56" height="72" rx="7" fill="url(#tealGrad)"/>
    <rect x="14" y="60" width="56" height="18" fill="url(#darkTeal)"/>
    <polyline points="14,68 19,63 24,68 29,63 34,68 39,63 44,68 49,63 54,68 59,63 64,68 69,63 70,68" fill="none" stroke="url(#tealGrad)" stroke-width="2"/>
    <rect x="24" y="18" width="36" height="4.5" rx="2.2" fill="white" opacity="0.9"/>
    <rect x="24" y="28" width="30" height="4.5" rx="2.2" fill="white" opacity="0.9"/>
    <rect x="24" y="38" width="36" height="4.5" rx="2.2" fill="white" opacity="0.9"/>
    <rect x="24" y="48" width="22" height="4.5" rx="2.2" fill="white" opacity="0.9"/>
  </g>

  <!-- Green badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="72" cy="72" r="16" fill="white"/>
    <circle cx="72" cy="72" r="13" fill="url(#greenGrad)"/>
    <polyline points="64,72 70,78 81,65" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
